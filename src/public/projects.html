<section class="txt-section">
  <style>
    #projects {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 40px;
      width: 90%;
      height: 700px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
    }
    .project-container {
      width: 600px;
      position: relative;
      margin: 20px;
      transition: transform 0.3s ease;
    }
    .project-container:hover {
      transform: translateY(-10px);
    }
    .project-card {
      position: relative;
      flex-shrink: 0;
      display: flex;
      gap: 20px;
      padding: 20px;
      border-top: dotted var(--text-grey) 1px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .project-container img {
      border-radius: 6px;
      object-fit: cover;
    }
    .project-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .project-footer p {
      margin: 0;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 75%;
      color: var(--text-grey);
      background-color: var(--frame-bcol);
    }
    .project-card div p {
      margin: 0;
      padding-bottom: 10px;
      font-size: calc(1rem * 0.9);
    }
    /* the title and view count sit on the dotted top border */
    .proj-title,
    .proj-stats {
      position: absolute;
      margin: 0;
      padding: 0 4px;
      white-space: nowrap;
      text-align: center;
      background-color: var(--frame-bcol);
    }
    .proj-title {
      top: -10px;
      left: 120px;
      transform: translateX(-50%);
      font-size: 1rem;
    }
    .proj-stats {
      top: -8px;
      right: 60px;
      transform: translateX(50%);
      font-size: 0.8rem;
      color: var(--text-grey);
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }
    .project-container:hover .proj-stats {
      opacity: 1;
    }
    /* the edit link is an anchor so it can be opened in a new tab,
       these match what 'article button' gives the refresh button next to it */
    a.icon-button {
      background: 0 0;
      color: var(--text-grey);
      text-decoration: none;
    }
    a.icon-button:hover {
      color: var(--text-normal);
    }
    @media (max-width: 600px) {
      #projects {
        width: 100%;
      }
    }
  </style>
  <h2 style="margin-bottom: 0px">Projects</h2>
  <p class="small-p" style="margin-bottom: 30px">Projects I created and own.
    <button class="icon-button" onclick="reloadProjects()">
      <svg class="fa fa-refresh icon" aria-hidden="true"><use href="#i-refresh"/></svg>
    </button>
    <a class="icon-button" href="/projectsEdit.html" title="edit projects">
      <svg class="fa fa-pencil icon" aria-hidden="true"><use href="#i-pencil"/></svg>
    </a>
  </p>
  <div id="projects"></div>
</section>
