<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>

  <!-- shown once /auth/me says were logged in -->
  <div class="auth-container" id="signed-in" hidden>
    <div class="auth-card">
      <h3>Signed in</h3>
      <div class="row"><span class="k">user</span><span id="me-name"></span></div>
      <button onclick="location.href='./profile.html'">Profile</button>
      <button class="link-btn" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="auth-container" id="forms" hidden>
    <!-- LOGIN -->
    <div class="auth-card">
      <h3>Login</h3>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="login-username">Username</label>
          <div class="input-group">
            <input id="login-username" name="username" autocomplete="username" required>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="login-password">Password</label>
          <div class="input-group">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" aria-label="show password"
                    onclick="togglePassword(this,'login-password')">&#128065;</button>
          </div>
        </div>
        <button type="submit" style="margin-top:15px;width:100%">Login</button>
      </form>
      <button class="link-btn" onclick="location.href='./forgot.html'">forgot password?</button>
      <div class="response" id="login-response" role="status" aria-live="polite"></div>
    </div>

    <!-- REGISTER -->
    <div class="auth-card">
      <h3>Register</h3>
      <form id="register-form" autocomplete="on">
        <div class="field">
          <label for="register-username">Username</label>
          <div class="input-group">
            <input id="register-username" name="username" autocomplete="username"
                   pattern="[A-Za-z0-9_\-]{3,30}" title="3-30 chars, letters numbers _ and -" required>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="register-email">Email</label>
          <div class="input-group">
            <input id="register-email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="register-password">Password</label>
          <div class="input-group">
            <input id="register-password" name="new-password" type="password" autocomplete="new-password"
                   minlength="8" maxlength="200" required>
            <button type="button" class="toggle-pass" aria-label="show password"
                    onclick="togglePassword(this,'register-password')">&#128065;</button>
          </div>
        </div>
        <button type="submit" style="margin-top:15px;width:100%">Register</button>
      </form>
      <div class="hint">usernames are lowercase. email is used for password resets.</div>
      <div class="response" id="register-response" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="./auth.js"></script>
  <script>
    var loginResp = document.getElementById('login-response');
    var registerResp = document.getElementById('register-response');

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = this.querySelector('button[type=submit]');
      say(loginResp, '');
      withBusy(btn, '...', function () {
        return post('/auth/login', {
          identifier: document.getElementById('login-username').value,
          password: document.getElementById('login-password').value
        }).then(function (r) {
          if (!r.ok) return say(loginResp, errMsg(r.error), 'err');
          location.href = safeNext();
        });
      });
    });

    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = this.querySelector('button[type=submit]');
      say(registerResp, '');
      withBusy(btn, '...', function () {
        return post('/auth/register', {
          name: document.getElementById('register-username').value,
          email: document.getElementById('register-email').value,
          password: document.getElementById('register-password').value
        }).then(function (r) {
          if (!r.ok) return say(registerResp, errMsg(r.error), 'err');
          location.href = safeNext(); // register logs you in
        });
      });
    });

    document.getElementById('logout-btn').addEventListener('click', function () {
      post('/auth/logout').then(function () { location.reload(); });
    });

    // decide which half of the page to show
    getJSON('/auth/me').then(function (me) {
      if (me.ok) {
        var next = new URLSearchParams(location.search).get('next');
        if (next) return location.href = safeNext();
        document.getElementById('me-name').textContent = me.name;
        document.getElementById('signed-in').hidden = false;
      } else {
        document.getElementById('forms').hidden = false;
      }
    });
  </script>

</body>
</html>
